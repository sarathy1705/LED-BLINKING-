<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#fbfcfe"/>
<g font-family="Arial, sans-serif" fill="#14213d" stroke="#14213d" stroke-width="3">
  <text x="600" y="42" text-anchor="middle" font-size="28" font-weight="700" stroke="none">555 Timer Astable LED Blinker</text>
  <text x="600" y="70" text-anchor="middle" font-size="16" fill="#50627a" stroke="none">PCB wiring reference — 5 V supply</text>
  <!-- IC -->
  <rect x="490" y="190" width="220" height="230" rx="10" fill="#e7eef8"/>
  <text x="600" y="218" text-anchor="middle" font-size="20" font-weight="700" stroke="none">NE555 / LM555</text>
  <text x="600" y="245" text-anchor="middle" font-size="15" stroke="none">Astable oscillator</text>
  <text x="470" y="270" text-anchor="end" font-size="16" stroke="none">8 VCC</text>
  <text x="470" y="315" text-anchor="end" font-size="16" stroke="none">4 RESET</text>
  <text x="470" y="360" text-anchor="end" font-size="16" stroke="none">7 DISCH</text>
  <text x="470" y="395" text-anchor="end" font-size="16" stroke="none">2,6 TRIG/THR</text>
  <text x="730" y="270" font-size="16" stroke="none">3 OUT</text>
  <text x="730" y="360" font-size="16" stroke="none">5 CTRL</text>
  <text x="600" y="465" text-anchor="middle" font-size="16" stroke="none">1 GND</text>
  <!-- rails -->
  <path d="M160 120 H1040" stroke="#c62828" stroke-width="6"/>
  <text x="145" y="126" text-anchor="end" font-size="18" fill="#c62828" stroke="none">+5 V</text>
  <path d="M160 530 H1040" stroke="#263238" stroke-width="6"/>
  <text x="145" y="536" text-anchor="end" font-size="18" stroke="none">0 V / GND</text>
  <!-- VCC and reset -->
  <path d="M520 120 V260 M520 260 H490 M520 260 H440 V310 H490" fill="none"/>
  <circle cx="520" cy="120" r="5" fill="#c62828"/>
  <text x="390" y="304" font-size="16" stroke="none">RESET tied high</text>
  <!-- GND -->
  <path d="M600 420 V530" fill="none"/>
  <!-- timing resistors -->
  <path d="M350 120 V150" fill="none"/>
  <rect x="330" y="150" width="40" height="75" fill="#fff3cd"/>
  <path d="M350 225 V270 H490" fill="none"/>
  <text x="350" y="143" text-anchor="middle" font-size="17" stroke="none">R1</text>
  <text x="350" y="188" text-anchor="middle" font-size="17" stroke="none">1 kΩ</text>
  <path d="M250 120 V150" fill="none"/>
  <rect x="230" y="150" width="40" height="75" fill="#fff3cd"/>
  <path d="M250 225 V300 H440 V360 H490" fill="none"/>
  <text x="250" y="143" text-anchor="middle" font-size="17" stroke="none">R2</text>
  <text x="250" y="188" text-anchor="middle" font-size="17" stroke="none">100 kΩ</text>
  <!-- timing capacitor -->
  <path d="M440 360 V405" fill="none"/>
  <path d="M405 410 H475 M405 425 H475" fill="none" stroke-width="5"/>
  <path d="M440 425 V530" fill="none"/>
  <text x="385" y="420" text-anchor="end" font-size="17" stroke="none">C1</text>
  <text x="385" y="443" text-anchor="end" font-size="17" stroke="none">10 µF</text>
  <!-- output LED branch -->
  <path d="M710 270 H820 V300" fill="none"/>
  <polygon points="800,300 840,300 820,335" fill="#ff5252"/>
  <path d="M805 345 H835" fill="none" stroke-width="5"/>
  <path d="M820 345 V385" fill="none"/>
  <rect x="800" y="385" width="40" height="70" fill="#fff3cd"/>
  <path d="M820 455 V530" fill="none"/>
  <text x="890" y="320" font-size="17" stroke="none">D1 LED</text>
  <text x="890" y="343" font-size="17" stroke="none">5 mm red</text>
  <text x="890" y="420" font-size="17" stroke="none">R3 330 Ω</text>
  <!-- control capacitor -->
  <path d="M710 360 H760 V405" fill="none"/>
  <path d="M730 410 H790 M730 425 H790" fill="none" stroke-width="5"/>
  <path d="M760 425 V530" fill="none"/>
  <text x="815" y="415" font-size="17" stroke="none">C2 10 nF</text>
  <!-- decoupling -->
  <path d="M950 120 V190" fill="none"/>
  <path d="M920 195 H980 M920 210 H980" fill="none" stroke-width="5"/>
  <path d="M950 210 V530" fill="none"/>
  <text x="1000" y="200" font-size="17" stroke="none">C3 100 nF</text>
  <!-- nodes -->
  <circle cx="440" cy="360" r="6" fill="#14213d"/><circle cx="820" cy="270" r="6" fill="#14213d"/>
</g>
</svg>